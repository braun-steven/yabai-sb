# Example yabai configuration, converted from examples/yabairc. Copy it to ~/.config/yabai/yabai.toml and change it.
# Each [config] line is the `yabai -m config <option>` of the same name. Check a file with `yabai --check-config <file>`.
#
# The scripting addition is loaded by the daemon when [daemon] load_scripting_addition is true. For this to work
# you must configure sudo such that it will be able to run `yabai --load-sa` without a password. See this wiki page
# for information:
#  - https://github.com/asmvik/yabai/wiki/Installing-yabai-(latest-release)#configure-scripting-addition
#
# The yabairc ended with `echo "yabai configuration loaded.."`. A TOML file runs nothing, so it has no such line.

# [daemon]
# Runs `sudo -n yabai --load-sa` at startup and after the Dock restarts. Built-in loading takes effect from phase 4 of
# the static config plan; until then the daemon does not load it at startup, and the dock_did_restart signal below does
# it after each Dock restart.
# load_scripting_addition = true

# Loads the scripting addition again after each Dock restart (the yabairc signal line).
# [[signal]]
# event = "dock_did_restart"
# action = "sudo yabai --load-sa"

# global settings
[config]
external_bar = "off:40:0"
menubar_opacity = 1.0
mouse_follows_focus = false
focus_follows_mouse = false
display_arrangement_order = "default"
window_origin_display = "default"
window_shadow = true                  # true / false, or "float"
skip_window_focus_animation = false
window_animation_duration = 0.0
window_animation_easing = "ease_out_circ"
window_opacity_duration = 0.0
active_window_opacity = 1.0
normal_window_opacity = 0.90
window_opacity = false
insert_feedback_color = 0xffd75f5f
window_border = false
window_border_width = 4.0
window_border_hide_single = false
active_window_border_color = 0xffe1e3e4
normal_window_border_color = 0xff494d64
top_padding = 12
bottom_padding = 12
left_padding = 12
right_padding = 12
window_gap = 6
layout = "tree"
mouse_modifier = "fn"
mouse_action1 = "move"
mouse_action2 = "resize"
mouse_drop_action = "swap"

# Set padding for spacebar
# external_bar = "all:32:0"  # Top
# external_bar = "all:0:24"  # Bottom

# Focus window to mouse when windows/application is destroyed
# [[signal]]
# event = "window_destroyed"
# action = "yabai -m query --windows --window &> /dev/null || yabai -m window --focus mouse"
#
# [[signal]]
# event = "application_terminated"
# action = "yabai -m query --windows --window &> /dev/null || yabai -m window --focus mouse"
#
# [[signal]]
# event = "window_focused"
# action = "sketchybar --trigger window_focus"
#
# [[signal]]
# event = "window_created"
# action = "sketchybar --trigger windows_on_spaces"
#
# [[signal]]
# event = "window_destroyed"
# action = "sketchybar --trigger windows_on_spaces"

# A batch of `yabai -m` commands in one message is shown in examples/batch.sh. A TOML file does not need one.
